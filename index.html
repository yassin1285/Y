<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Your Dream Jobs</title>
    <style>
        /* ==========================================================================
           1. CORE RESETS & BASE STYLES
           ========================================================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background-color: #f5f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Master Container matching the UI layout aspect ratio */
        .app-container {
            width: 100%;
            max-width: 1280px;
            height: 800px;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            position: relative;
            overflow: hidden;
        }

        /* ==========================================================================
           2. LAYOUT SECTIONS & ENTRY ANIMATIONS
           ========================================================================== */

        /* Top Header Bar with Multi-stop Blue Gradient (Slides Down) */
        .header-banner {
            background: linear-gradient(to right, #40e0d0 0%, #0080ff 35%, #003399 100%);
            padding: 20px 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: slideDown 0.6s ease-out forwards;
        }

        /* Pill Shaped Container Design for Search */
        .search-bar {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(5px);
            border: 2px solid #4a5568;
            width: 100%;
            max-width: 750px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            padding: 8px 24px;
        }

        .search-bar input {
            background: transparent;
            border: none;
            outline: none;
            width: 100%;
            padding: 6px 12px;
            font-size: 18px;
            font-weight: bold;
            color: #ffffff;
            letter-spacing: 1px;
        }

        /* Custom Placeholder Color Formatting */
        .search-bar input::placeholder {
            color: rgba(255, 255, 255, 0.8);
        }

        .icon {
            font-size: 20px;
            color: #4a5568;
            cursor: pointer;
        }

        /* Core Dynamic Body Content Setup */
        .main-body {
            flex: 1;
            padding: 50px 80px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        /* Typographic Display Block styling (Fades In) */
        .hero-text-container {
            margin-top: 10px;
            opacity: 0;
            animation: fadeIn 0.8s ease-out 0.4s forwards;
        }

        .main-title {
            font-size: 72px;
            font-weight: 400;
            color: #000000;
            line-height: 1;
        }

        .subtitle {
            font-size: 20px;
            font-weight: bold;
            color: #2d3748;
            margin-left: 90px; /* Aligns visually staggered like the Canva file */
            letter-spacing: 0.5px;
        }

        /* Navigation Circular Node Track styling */
        .navigation-row {
            display: flex;
            justify-content: flex-end;
            gap: 30px;
            margin-top: -20px;
            padding-right: 40px;
        }

        /* Staggered Pop-In for Circle Buttons */
        .nav-circle {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background-color: #1565c0;
            color: #ffffff;
            border: none;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(21, 101, 192, 0.3);
            transition: transform 0.2s, background-color 0.2s;
            
            /* Animation base state */
            opacity: 0;
            transform: scale(0.3);
            animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        /* Sequential animation delays mimicking the layout video timeline */
        .nav-circle:nth-child(1) { animation-delay: 0.1s; }
        .nav-circle:nth-child(2) { animation-delay: 0.25s; }
        .nav-circle:nth-child(3) { animation-delay: 0.4s; }
        .nav-circle:nth-child(4) { animation-delay: 0.55s; }

        /* Active Highlight state matching Canva underline style accent */
        .nav-circle:first-child {
            text-decoration: underline;
            text-underline-offset: 6px;
        }

        /* Maintain hover state properties post-animation cycle */
        .nav-circle:hover {
            transform: scale(1.06) !important;
            background-color: #0d47a1;
        }

        /* Left Utility Button controls layout (Fades In) */
        .utility-buttons {
            display: flex;
            gap: 20px;
            margin-bottom: 10px;
            opacity: 0;
            animation: fadeIn 0.8s ease-out 0.4s forwards;
        }

        .btn-rect {
            background-color: #1565c0;
            color: #ffffff;
            border: none;
            padding: 18px 40px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn-rect:hover {
            background-color: #0d47a1;
            transform: translateY(-2px);
        }

        /* Footer Section mirroring Header Gradient Palette reversed (Slides Up) */
        .footer-banner {
            height: 110px;
            background: linear-gradient(to right, #0044cc 0%, #3399ff 65%, #40e0d0 100%);
            animation: slideUp 0.6s ease-out forwards;
        }

        /* ==========================================================================
           3. KEYFRAMES DEFINITIONS
           ========================================================================== */
        @keyframes slideDown {
            from { transform: translateY(-100%); }
            to { transform: translateY(0); }
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes popIn {
            from {
                opacity: 0;
                transform: scale(0.3);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Mobile Breakpoint Optimization Layer */
        @media (max-width: 900px) {
            .app-container {
                height: auto;
            }
            .navigation-row {
                flex-wrap: wrap;
                justify-content: center;
                padding-right: 0;
                margin: 40px 0;
            }
            .subtitle {
                margin-left: 0;
            }
            .utility-buttons {
                justify-content: center;
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header class="header-banner">
            <div class="search-bar">
                <span class="icon search-icon">🔍</span>
                <input type="text" id="jobSearch" placeholder="SEARCH">
        
            </div>
        </header>

        <main class="main-body">
            
            <div class="hero-text-container">
                <h1 class="main-title">JOBS</h1>
                <p class="subtitle">FIND YOUR DREAM JOBS</p>
            </div>

            <nav class="navigation-row">
                <button class="nav-circle dynamic-link" data-target="home">HOME</button>
                <button class="nav-circle dynamic-link" data-target="jobs">JOBS</button>
                <button class="nav-circle dynamic-link" data-target="profile">PROFILE</button>
                <button class="nav-circle dynamic-link" data-target="about">ABOUT</button>
            </nav>

            <div class="utility-buttons">
                <button class="btn-rect dynamic-link" data-target="contact">CONTACT US</button>
                <button class="btn-rect dynamic-link" data-target="help">HELP</button>
            </div>
        </main>

        <footer class="footer-banner"></footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            
            // Core Navigation Routing system via Data attributes
            const interactiveElements = document.querySelectorAll('.dynamic-link');

            interactiveElements.forEach(element => {
                element.addEventListener('click', (e) => {
                    const destination = e.target.getAttribute('data-target');
                    executeNavigation(destination);
                });
            });

            // Handle user search engine entry functionality
            const searchInput = document.getElementById('jobSearch');
            
            searchInput.addEventListener('keypress', (event) => {
                if (event.key === 'Enter') {
                    const queryValue = searchInput.value.trim();
                    if (queryValue !== '') {
                        processJobQuery(queryValue);
                    }
                }
            });
        });

        // Routing Navigation Simulator Module
        function executeNavigation(targetPage) {
            console.log(`Routing requested path context for pipeline target: /${targetPage}`);
            
            switch (targetPage) {
                case 'home':
                    alert('Loading Main Dashboard / home context feed.');
                    break;
                case 'jobs':
                    alert('Redirecting to Active Job Board Openings.');
                    break;
                case 'profile':
                    alert('Loading Applicant Profile and CV settings portfolio.');
                    break;
                case 'about':
                    alert('Opening Corporate Information System profiles.');
                    break;
                case 'contact':
                    alert('Initializing help center ticket intake messaging console.');
                    break;
                case 'help':
                    alert('Opening documentation index reference directory.');
                    break;
                default:
                    console.warn('Navigation routine handling failure on unexpected route ID target.');
            }
        }

        // Logic interface module processing target job criteria queries
        function processJobQuery(query) {
            alert(`Querying active database pipelines processing search filter criteria for: "${query}"`);
        }
    </script>
</body>
</html>
