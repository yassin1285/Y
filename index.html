<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wireframe Functional Layout</title>
    <style>
        /* Base styles to clear page margins */
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
        }

        /* 1. Main Page Canvas Container (The thick outer black border) */
        .wireframe-container {
            width: 900px;
            height: 550px;
            border: 3px solid #0b223a;
            background-color: #ffffff;
            box-sizing: border-box;
            padding: 30px;
            
            /* Flex layout pulls items into Top, Middle, and Bottom sections */
            display: flex;
            flex-direction: column;
            justify-content: space-between; 
        }

        /* 2. Top Row Flex Layout */
        .top-row {
            display: flex;
            align-items: center;
            gap: 20px;
            width: 100%;
        }

        /* The small logo square on the left */
        .logo-box {
            width: 50px;
            height: 50px;
            border: 2px solid #0b223a;
            border-radius: 8px;
        }

        /* The long text search field */
        .search-bar {
            flex-grow: 1;
            height: 46px;
            border: 2px solid #0b223a;
            padding-left: 15px;
            font-size: 16px;
            letter-spacing: 1px;
            box-sizing: border-box;
        }

        /* 3. Middle Action Row Layout */
        .middle-content {
            display: flex;
            gap: 20px;
            padding-left: 100px; /* Shifts buttons slightly right to match wireframe placement */
        }

        /* Sharp rectangular center buttons */
        .rect-btn {
            padding: 12px 28px;
            border: 2px solid #0b223a;
            background-color: transparent;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .rect-btn:hover {
            background-color: #0b223a;
            color: #ffffff;
        }

        /* 4. Bottom Footer Navigation Layout */
        .bottom-row {
            display: flex;
            gap: 35px;
            padding-left: 50px; /* Aligns items away from the left rim */
        }

        /* Capsule/Rounded shape buttons at bottom */
        .rounded-btn {
            padding: 12px 35px;
            border: 2px solid #0b223a;
            border-radius: 25px; /* Creates smooth capsule curvature */
            background-color: transparent;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .rounded-btn:hover {
            background-color: #0b223a;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="wireframe-container">

        <header class="top-row">
            <div class="logo-box"></div>
            <input type="text" class="search-bar" placeholder="SEARCH">
        </header>

        <main class="middle-content">
            <button class="rect-btn" onclick="alert('Contact button clicked!')">CONTACT</button>
            <button class="rect-btn" onclick="alert('Learn More button clicked!')">LEARN MORE</button>
        </main>

        <footer class="bottom-row">
            <button class="rounded-btn" onclick="alert('Redirecting to Sign Up...')">SIGN UP</button>
            <button class="rounded-btn" onclick="alert('Redirecting to Sign In...')">SIGN IN</button>
            <button class="rounded-btn" onclick="alert('Opening Feedback Form...')">FEEDBACK</button>
        </footer>

    </div>

</body>
</html>
